<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Drill 1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body
        {
            background-color: rgb(200, 227, 255);
        }
     
     </style>
</head>
<body>
    <div class="container" style="background-color: rgb(205, 205, 255); padding: 20px; margin-top: 50px; border-radius: 20px; width: 1000px; height: 400px;">
  
    <h1 style="text-align: center;">Electricity Usage Checker</h1>
    <!--comment-->
        <br>
    <input type="text" id="Electricity" class="form-control" placeholder="type here" step="width: 100px">

    <center>
    <button class="btn btn-info" onclick="checkElectricity()" style="max-width: 80px;">Check</button>

    <br><br>
    <script>


    function checkElectricity(){
        var Electricity = document.getElementById("Electricity").value;

        if(isNaN(Electricity) || Electricity < 0){

            alert("Please input a valid number");

        }

        else if(Electricity >= 0 && Electricity <= 100){

            alert("Lifeline Consumer: Discounted Electricity Rates");

        }

        else if(Electricity >= 101 && Electricity <= 200){

            alert("Low Consumption: Normal Residential Rate");

        }

        else if(Electricity >= 201 && Electricity <= 300){

            alert("Average Consumption : Typical Electricity Usage");

        }

        else if(Electricity >= 301 && Electricity <= 500){

            alert("High Consumption : Higher electricity usage");

        }

        else{

            alert("You have a very high electricity usage");
        }

        }
    </script>

</body>
</html>
